# sev1daemon runtime lockfile — pinned transitive closure.
#
# Regenerate after changing pyproject.toml [project.dependencies]:
#
#     python -m venv /tmp/lock && /tmp/lock/bin/pip install . && \
#       /tmp/lock/bin/pip freeze --exclude-editable > requirements.lock
#
# Then prune lines that are not in the closure of the runtime deps and add
# any missing transitive packages by hand. Long-term we should adopt
# pip-tools / uv pip compile to automate hash-bound resolution.
#
# 2026-10: anyio 4.13.0 -> 4.14.2 (PYSEC-2026-4024, PYSEC-2026-4025) and
# idna 3.14 -> 3.20 (PYSEC-2026-215), re-resolved with
#     uv pip compile pyproject.toml --universal --python-version 3.10
# using the previous pins as constraints. sniffio dropped out of the closure;
# exceptiongroup is only needed on Python 3.10.

