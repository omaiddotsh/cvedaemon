services:
  cvedaemon:
    build: .
    image: cvedaemon:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SCA_TOKEN: ${SCA_TOKEN:-}
      CVEDAEMON_HEALTH_HOST: "0.0.0.0"
      CVEDAEMON_HEALTH_PORT: "8080"
    volumes:
      - ./config.yaml:/etc/cvedaemon/config.yaml:ro
      - cvedaemon-state:/var/lib/cvedaemon
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3); sys.exit(0 if r.status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  cvedaemon-state:
